name: Build NotiChat iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          xcodebuild -version

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -project NotiChat.xcodeproj \
            -scheme NotiChat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/NotiChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r "build/NotiChat.xcarchive/Products/Applications/NotiChat.app" Payload/
          zip -qr "NotiChat.ipa" Payload
          ls -lh NotiChat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotiChat-iOS-v1.0.0
          path: NotiChat.ipa
          retention-days: 14
