name: Build NotiChat iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Unsigned IPA
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        run: |
          xcodebuild -version

      - name: Build and Archive
        run: |
          xcodebuild clean archive \
            -project NotiChat.xcodeproj \
            -scheme NotiChat \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "build/NotiChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r "build/NotiChat.xcarchive/Products/Applications/NotiChat.app" Payload/
          zip -qr "NotiChat.ipa" Payload
          ls -lh NotiChat.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NotiChat-iOS-v1.0.0
          path: NotiChat.ipa
          retention-days: 14

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: NotiChat.ipa
          tag_name: v1.0.0-${{ github.run_number }}
          name: NotiChat iOS v1.0.0 (Build ${{ github.run_number }})
          body: |
            ## NotiChat iOS (Ready for Sideloadly)
            - 100% interoperable with Android NotiChat
            - E2EE RSA 2048 + AES-256-CBC
            - Push notifications & real-time messaging via ntfy
            - Drag & drop `NotiChat.ipa` into Sideloadly!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
